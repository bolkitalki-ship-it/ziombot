name: Build ZiomBot
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - run: mvn package
      - uses: actions/upload-artifact@v4
        with:
          name: ZiomBot-Plugin
          path: target/ZiomBot-2.0.0.jar
